name: AcademiCollab CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Environment Configurations
        run: |
          echo "DB_NAME=test_academicollab_db" > .env
          echo "DB_USER=postgres" >> .env
          echo "DB_PASSWORD=ci_test_password_secure" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Initialize Stack and Network Architecture
        run: docker compose up -d db backend

      - name: Verify Service Connectivity
        run: |
          docker compose exec -T db sh -c "until pg_isready -U postgres; do sleep 1; done"

      - name: Execute Parallelized Django Test Matrices
        run: |
          docker compose exec -T backend python manage.py test --parallel --noinput

      - name: Teardown CI Infrastructure
        if: always()
        run: docker compose down --volumes