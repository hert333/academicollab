name: academicollab

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # REFACTORED COMMAND: Chains database migration execution before initiating server binding
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    container_name: academicollab_backend
    depends_on:
      db:
        condition: service_started
        required: true
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG}
      DB_HOST: ${DB_HOST}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: ${DB_PORT}
    networks:
      collab_network: null
    ports:
      - mode: ingress
        target: 8000
        published: "8000"
        protocol: tcp
    volumes:
      - type: bind
        source: ./backend
        target: /app
        bind: {}

  db:
    container_name: academicollab_db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      collab_network: null
    ports:
      - mode: ingress
        target: 5432
        published: "5432"
        protocol: tcp
    volumes:
      - type: volume
        source: pg_data
        target: /var/lib/postgresql/data
        volume: {}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: academicollab_frontend
    depends_on:
      backend:
        condition: service_started
        required: true
    environment:
      - NODE_ENV=development
    networks:
      collab_network: null
    ports:
      - mode: ingress
        target: 3000
        published: "3000"
        protocol: tcp
    stdin_open: true
    tty: true
    volumes:
      - type: bind
        source: ./frontend
        target: /app
      - type: volume
        target: /app/node_modules

networks:
  collab_network:
    name: academicollab_collab_network
    driver: bridge

volumes:
  pg_data:
    name: academicollab_pg_data
    driver: local